<!DOCTYPE html>

<html>

<head>

<title>Task 3 : Tables</title>
</head>


<body>

<table border="1" cellpadding="22" cellspacing="5">

	<!--  first row has the table headers  ===> needs to be aligened to the center-->
	<tr align="center">
		<th>Name</th>
		<th>Age</th>
		<th>Height</th>
	</tr>

	<!-- the second row has data and i have to have it aligned to the left -->
	<tr >
		<td align="left">Ahmed</td>
		<td align="left">20</td>
		<td align="left">173</td>
	</tr>

	<!-- the theird row has data and i have to have it aligned to the left and have to merege cellls using coloumn span -->
	<tr>
		<td colspan="2"  align="right" bgcolor="yellow">double col span</td>
		<td align="left">A</td>
	</tr>


	<!-- the fourth row has data and i have to have it aligned to the left and have to merege cellls using row span -->
	<tr>
		<td rowspan="2" align="center">row span</td>
		<td align="left">B</td>
		<td align="left">C</td>
	</tr>

	<!-- last row has the rest of the data and its aligned to the left -->
	<tr>
		<td align="left">f</td>
		<td align="left">c</td>
	</tr>


</table>

</body>


</html>
