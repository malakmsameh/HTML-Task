<!DOCTYPE html>

<html>

<head>

<title>Task 1 : Forms</title>
</head>

<h1>Application Form </h1>
<br>

<body>

<form>
	<label>First Name:</label>
	<input type="text" required></input>

	<label>Last Name:</label>
	<input type="text" required></input>


	<br><br>
	<label>Date of Birth:</label>
	<input type="date"></input>

	<label>Age:</label>
	<input type="number"></input>

	<br><br>

	<label>Gender:</label>
	<select>
		<option value="male">Male</option>
		<option value="female">Female</option>
	</select>


	<lable>Email Address:</lable>
	<input type="email" placeholder="Enter email address" required></input>
<br><br>
	<label>Positions Available:</label>
	<input type="radio">Junior Developer</input>

	<input type="radio">Mid-level Developer</input>

	<input type="radio">Senior Developer</input>


	<br><br>

	<label>Programming Languages:</label>

	<input type="checkbox">Java</input>
	<input type="checkbox">JavaScript</input>
	<input type="checkbox">Python</input>


		<br><br>

	<label>Password:</label>
	<input type="password" required></input>

	<label>Confirm Password:</label>
	<input type="password" required></input>

<br><br>

	<input type="submit"></input>
	<input type="reset"></input>
</form>

</body>

</html>
